# Bat's List — curated item types to flag at auction.
# The Agent matches SEMANTICALLY against these descriptions.
# `examples` are illustrative hints, NOT an exhaustive whitelist —
# generic/off-brand items still match if they fit the description
# UNLESS the description sets a brand or quality bar, in which case
# that bar is the whole point of the bucket.
#
# SCOPE POLICY (2026-09-15, user decision — do not reverse without the user's
# explicit permission in the conversation where the edit is made):
#
#   Bat's List is a TARGETED list, not a scan of the auction. Before this
#   date 40% of every auction was flagged (11,160 of 28,034 lots on
#   2026-09-13) while the bid/watch history showed the household engaging
#   with ~1 in 80 of them. The main viewer already does the "large search";
#   this list exists to be short enough to actually read.
#
#   - Do NOT widen a bucket description back out. Phrases like "Branded or
#     generic", "flag every working X", or "favor" softened into "also
#     include" are exactly what was removed. A low flag rate is NOT a reason
#     to widen a bucket; if something wanted is being missed, add the specific
#     product or brand, not the whole type.
#   - Do NOT re-add a retired bucket or its scope under another name.
#     Retired 2026-09-15 (zero or near-zero engagement across four months of
#     history): "Electronics" (catch-all; replaced by "Monitors & displays"
#     and "Networking"), "Batteries & chargers", "Tarps",
#     "Sports & recreation gear" (replaced by "Backyard games",
#     "Nets, goals & hoops", "Bikes, scooters & skates").
#   - SCAN buckets — kept broad on purpose even though they rarely convert —
#     are exactly these and no others: the Food & drink group,
#     "Board games", "Kitchen utensils & gadgets", "Coffee & espresso",
#     "Extension cords & power strips".
#   - Every bucket that names brands is a brand gate: a no-name item of the
#     same type is NOT a match. Spell brands the way titles do
#     ("PHILIPS ONEBLADE", "PHILIPS ONE", "DR. MARTENS") so the gate
#     captures rather than excludes.
#
# `group` assigns each bucket to a top-level group for two-level
# Bat's List navigation in the viewer. The Agent IGNORES `group`
# (it only matters to the build script / viewer).
#
# Four fields drive tools/prefilter.py and are NOT shown to the Agent:
#
#   seeds:      lexical shortlist terms. Lowercased, anchored at a word
#               boundary on the LEFT only — `tote` matches "TOTES" and `key`
#               matches "KEYBOARD" but not "MONKEY". Include both type words
#               and brand names, since many titles are a bare brand.
#   categories: HiBid breadcrumb PREFIXES, matched on whole " - " segments.
#               This is the only axis that reaches a bare-SKU lot whose title
#               carries no usable keyword at all.
#   exclude:    veto terms. A lot matching one is never shortlisted for this
#               bucket, at zero model cost.
#   aliases:    former names of this bucket, so --backtest can score a
#               previous week's labels after a rename.
#   condition_in: allowlist over the structured `condition` field. Use ONLY on
#               sealed consumables, where anything below a "new" grade means the
#               pack was opened and the lot is an automatic pass (see
#               profile.yaml `not_wanted`). This is a fact from the scrape, not
#               the quality judgement forbidden below — never use it to encode
#               "good brand". A lot with no condition recorded is never gated
#               out. Values are HiBid's own gradings, verbatim, and must match
#               CONDITION_LABELS in scraper/condition.py exactly — a value that
#               is not in that list matches nothing and silently empties the
#               bucket.
#
# THE PREFILTER MUST NEVER ENCODE A QUALITY GATE. Several buckets below say
# "QUALITY or BRANDED ... do NOT flag generic". That judgement belongs to the
# Agent, reading `description`. Seed those buckets with plain TYPE words so
# the shortlist stays wide; encoding the gate as a keyword rule would turn
# curation into string matching and destroy it.
#
# `subtypes` IS shown to the Agent — it is the advisory vocabulary for
# `bats_subtype`, the drill-down's third level. Reusing wording is the whole
# point; forty near-synonyms are useless as navigation.

buckets:
  - name: "Smart home"
    group: "Electronics & gaming"
    description: >
      Smart lighting and home-automation devices — smart bulbs, LED light
      strips, smart switches and plugs, smart thermostats, smart hubs,
      sensors, video doorbells, and anything app- or voice-controlled for
      the home. Branded or off-brand both qualify.
    examples: ["Hue", "Lifx", "Govee", "Lepro", "Ecobee", "Nest", "Wyze", "Kasa", "Sengled"]
    subtypes: ["smart bulbs", "light strips", "smart plugs", "thermostats",
               "sensors", "video doorbells", "smart hubs"]
    seeds: ["smart bulb", "smart light", "light strip", "led strip", "smart plug",
            "smart switch", "smart outlet", "thermostat", "smart hub", "video doorbell",
            "doorbell camera", "motion sensor", "smart sensor", "alexa", "google home",
            "smart speaker", "hue", "lifx", "govee", "lepro", "ecobee", "wyze",
            "kasa", "sengled", "smart home", "ring sensor", "ring alarm",
            "ring camera", "blink camera", "arlo", "security camera",
            "smart doorbell", "echo dot", "echo show", "smart display"]
    seed_exempt: ["Nest"]  # nesting bowls, nesting tables

  - name: "Smart locks"
    group: "Electronics & gaming"
    description: >
      Smart and keyless locks of every kind — not just doors. Smart door
      locks and deadbolts, keypad/keyless entry locks, fingerprint and app-
      or Bluetooth-controlled locks, smart gate locks, smart padlocks, and
      outdoor/garage smart locks. Any keyless-entry hardware counts.
      Branded or generic.
    examples: ["August", "Schlage Encode", "Yale Assure", "Level", "Wyze Lock", "Master Lock smart", "eufy"]
    subtypes: ["door locks", "deadbolts", "keypad locks", "padlocks", "lock boxes"]
    seeds: ["smart lock", "keyless lock", "keyless entry", "keypad lock",
            "fingerprint lock", "deadbolt", "smart deadbolt", "smart padlock",
            "schlage", "yale assure", "august lock", "eufy lock", "lockbox",
            "lock box"]
    seed_exempt: ["August", "Level", "Wyze Lock", "Master Lock smart", "eufy"]

  - name: "Monitors & displays"
    group: "Electronics & gaming"
    description: >
      Computer monitors and displays for a desk setup — gaming monitors,
      ultrawides, 4K/high-refresh panels, portable USB-C monitors, and
      monitor arms/mounts sold on their own. Recognizable brands (LG,
      Samsung, Dell, ASUS, Acer, BenQ, MSI, Gigabyte, AOC). Not TVs, not
      projectors, not baby or blood-pressure monitors. Replaced the
      "Electronics" catch-all on 2026-09-15 — of 28 tracked lots in that
      bucket across four months, every one was a keyboard, mouse or tablet
      already held by another bucket.
    examples: ["LG UltraGear", "Samsung Odyssey", "Dell", "ASUS ROG", "BenQ"]
    subtypes: ["gaming monitors", "ultrawides", "office monitors",
               "portable monitors", "monitor arms"]
    seeds: ["monitor", "ultrawide", "ultragear", "odyssey g", "portable display",
            "monitor arm", "monitor mount", "144hz", "165hz", "240hz"]
    categories: ["Computers & Electronics - Computers - Monitors"]
    seed_exempt: ["Samsung Odyssey", "Dell", "ASUS ROG", "BenQ"]  # brand words
    # span laptops, phones and TVs; "monitor" + the Monitors breadcrumb carry them
    exclude: ["blood pressure monitor", "baby monitor", "bp monitor",
              "monitor stand riser", "heart rate monitor", "glucose monitor",
              "air quality monitor", "monitor light"]

  - name: "Networking"
    group: "Electronics & gaming"
    description: >
      Home networking — Wi-Fi routers, mesh systems, range extenders,
      modems, network switches, and Wi-Fi/ethernet adapters and cards.
      Recognizable brands (TP-Link, ASUS, Netgear, eero, Google, Ubiquiti).
      Not cables, not phone accessories.
    examples: ["TP-Link Deco", "ASUS", "Netgear Orbi", "eero", "Ubiquiti"]
    subtypes: ["routers", "mesh systems", "range extenders", "switches",
               "wifi adapters", "modems"]
    seeds: ["router", "mesh wifi", "wifi 6", "wifi 7", "wi-fi 6", "range extender",
            "wifi extender", "modem", "network switch", "ethernet switch",
            "wifi adapter", "tp-link deco", "tp link deco", "deco m", "deco x",
            "deco be", "netgear orbi", "orbi rbk", "orbi mesh", "eero", "archer ",
            "nighthawk", "ubiquiti", "ubiquiti unifi", "unifi dream", "unifi u6",
            "unifi u7", "powerline adapter", "poe switch"]
    categories: ["Computers & Electronics - Computers - Networking"]
    seed_exempt: ["ASUS"]  # sells far more laptops and monitors than routers
    exclude: ["ethernet cable", "cat6 cable", "cat 6 cable", "patch cable",
              "router bit", "router table", "wood router", "plunge router",
              "trim router", "router mount", "sprinkler"]

  - name: "Keyboards, keycaps & switches"
    group: "Electronics & gaming"
    aliases: ["Keyboards & PC peripherals", "Mechanical keyboards"]
    description: >
      Keyboards and the hobby around them — mechanical, gaming and
      wireless keyboards in every layout (full, TKL, 75%, 65%, 60%,
      Alice/ergo), plus keycap sets, key switches, barebones kits, and
      keyboard-specific accessories (cases, plates, coiled cables, wrist
      rests). A product line or model name identifies a keyboard as surely
      as the word does — "MX KEYS FOR MAC", "G915 X", "APEX PRO", "Q1 MAX",
      "ALTO KEYS" are all keyboards. Enthusiast/mechanical boards rank
      first; membrane and office boards from a real brand still count.
      Mice and everything else input-related go under "PC peripherals".
      Split from "Keyboards & PC peripherals" on 2026-09-15: ~90% of the
      history in that bucket was keyboards, and mice were two thirds of
      its lots.
    examples: ["Keychron", "Logitech G915 / MX Keys / Alto Keys", "Razer",
               "SteelSeries Apex", "GMMK / Glorious", "Akko", "Ducky",
               "Corsair", "HyperX", "Yunzii", "Ajazz", "RK Royal Kludge",
               "Wooting", "NuPhy"]
    subtypes: ["mechanical keyboards", "gaming keyboards", "wireless keyboards",
               "membrane keyboards", "keycaps", "key switches",
               "barebones kits", "keyboard accessories"]
    seeds: ["keyboard", "keycap", "key switch", "keyswitch", "tkl", "tenkeyless",
            "mechanical key", "hot swap", "hot-swap", "barebone", "wrist rest",
            "keychron", "ducky", "gmmk", "glorious", "akko", "yunzii", "ajazz",
            "royal kludge", "nuphy", "wooting", "apex pro", "apex 3", "apex 5",
            "apex 7", "apex 9", "g915", "g515", "g715", "g pro x", "pro x 60",
            "mx keys", "mx mechanical", "alto keys", "k70", "k65", "k100",
            "huntsman", "blackwidow", "deathstalker", "alloy origins",
            "alloy rise", "q1 max", "q1 pro", "k2 pro", "k8 pro", "v1 max",
            "linear switch", "tactile switch", "clicky switch", "num pad",
            "numpad", "macro pad", "coiled cable"]
    categories: ["Computers & Electronics - Computers - Peripherals - Keyboards / Mice"]
    exclude: ["ignition key switch", "ignition switch", "piano", "midi",
              "keyboard tray", "keyboard stand", "keyboard piano",
              "rgb fan", "pwm fan", "case fan", "fan controller", "icue rx",
              "icue commander", "argb 120", "clutch module", "pedal",
              "driving force shifter", "shifter for", "racing wheel",
              "mouse", "mousepad", "mouse pad"]
    seed_exempt: ["Razer", "SteelSeries Apex", "Corsair", "HyperX"]  # bare brand
    # words pull mice, headsets and case fans; model names above carry the boards

  - name: "PC peripherals"
    group: "Electronics & gaming"
    description: >
      Desk-side PC hardware other than keyboards — gaming and productivity
      mice (Logitech G / MX, Razer, Pulsar, Glorious, SteelSeries),
      mousepads and desk mats, webcams, graphics tablets (Wacom, Huion,
      XP-Pen), docking stations and USB-C hubs, capture cards, and
      controllers/wheels for PC. Recognizable brands; no-name mice and
      generic hubs are not a match. Keyboards go under "Keyboards, keycaps
      & switches"; headsets under "Audio & headphones"; monitors under
      "Monitors & displays".
    examples: ["Logitech G / MX Master", "Razer", "Pulsar", "Wacom", "Elgato",
               "CalDigit", "Anker dock"]
    subtypes: ["gaming mice", "productivity mice", "mousepads & desk mats",
               "webcams", "graphics tablets", "docks & hubs",
               "capture cards", "controllers & wheels"]
    seeds: ["gaming mouse", "wireless mouse", "mx master", "mx anywhere",
            "mx vertical", "lift vertical", "g502", "g305", "g309", "g703",
            "g pro wireless", "superlight", "naga", "basilisk", "viper",
            "deathadder", "pulsar x", "model o", "model d", "trackball",
            "mouse pad", "mousepad", "desk mat", "webcam", "brio ", "c920",
            "c922", "wacom", "intuos", "huion", "xp pen", "xp-pen",
            "docking station", "usb c hub", "usb-c hub", "thunderbolt dock",
            "capture card", "elgato", "stream deck", "caldigit",
            "driving force", "racing wheel", "flight stick", "hotas"]
    categories: ["Computers & Electronics - Computers - Peripherals - Keyboards / Mice"]
    seed_exempt: ["Razer", "Pulsar", "Anker dock"]  # model names above carry them
    exclude: ["mouse trap", "mouse pad heating", "keyboard", "rgb fan",
              "pwm fan", "case fan", "fan controller", "phone case",
              "usb cable", "usb c to"]

  - name: "VR headsets & accessories"
    group: "Electronics & gaming"
    aliases: ["Video games & VR"]
    description: >
      Virtual reality only — VR headsets (Meta Quest, PSVR2, Valve Index,
      HTC Vive, Pico), VR controllers, head straps, facial interfaces, link
      cables, prescription lens inserts, charging docks, and VR-specific
      accessories. Narrowed from "Video games & VR" on 2026-09-15:
      consoles, controllers and games are NOT wanted (2 watches, 0 bids in
      four months) — only VR-related gear. A Nintendo Switch, PS5 or Xbox
      is not a match.
    examples: ["Meta Quest 3", "PSVR2", "Valve Index", "HTC Vive", "Pico 4",
               "BoboVR", "Kiwi Design"]
    subtypes: ["vr headsets", "vr controllers", "head straps & batteries",
               "lens inserts", "vr accessories"]
    seeds: ["vr headset", "meta quest", "oculus", "quest 2", "quest 3", "psvr",
            "valve index", "htc vive", "pico 4", "bobovr", "kiwi design",
            "vr cover", "link cable", "virtual reality", "vr controller",
            "vr strap", "head strap", "vr lens"]
    exclude: ["vr45", "vr46"]

  - name: "Power tools"
    group: "Tools & garage"
    description: >
      Power tools and accessories — drills, drivers, saws, sanders,
      grinders, impact drivers, rotary/multi-tools, and tool
      batteries/chargers. Branded or generic, corded or cordless.
    examples: ["DeWalt", "Milwaukee", "Makita", "Bosch", "Ryobi", "Ridgid", "Metabo"]
    subtypes: ["drills", "impact drivers", "circular saws", "reciprocating saws",
               "sanders", "grinders", "rotary tools", "nailers", "tool batteries"]
    seeds: ["drill", "impact driver", "circular saw", "reciprocating saw", "jigsaw",
            "miter saw", "table saw", "sander", "angle grinder", "rotary tool",
            "multi-tool", "multi tool", "nail gun", "nailer", "heat gun", "power tool",
            "oscillating tool", "dremel", "dewalt", "milwaukee", "makita", "bosch",
            "ryobi", "ridgid", "metabo", "craftsman", "porter cable", "drill bit",
            "driver bit", "saw blade", "socket set", "wrench set", "screwdriver",
            "air compressor", "stud finder", "laser level", "caulking gun",
            "glue gun", "soldering", "rotary hammer", "planer", "router bit",
            "spray gun", "paint sprayer", "wood router", "router table"]

  - name: "Hand tools"
    group: "Tools & garage"
    description: >
      Non-powered hand tools and workshop hardware — chisels, wrenches and
      socket sets, pliers, hammers, screwdrivers, clamps and vises, levels,
      tape measures, utility knives, and hand saws. Also fasteners and
      consumable hardware bought in bulk: bolts, nuts, screws, washers,
      anchors, cable ties. Real tool brands or clearly workshop-grade;
      NOT generic all-in-one "379-pc home tool kit" boxes, "gift for men"
      socket gadgets, or a single bulk-listed part (the 76 lots of one
      speed handle on 2026-09-13). Clamps are a repeat interest (Bessey,
      Irwin). (Anything powered goes under "Power tools"; storage for
      tools goes under "Garage & tool organization".)
    examples: ["Irwin", "Bessey", "Stanley", "Knipex", "Channellock", "Estwing",
               "Bahco", "Milwaukee hand tools", "DeWalt mechanics sets", "Wera"]
    subtypes: ["chisels", "wrenches & sockets", "pliers", "hammers",
               "screwdrivers", "clamps & vises", "measuring tools",
               "hand saws", "fasteners", "brand tool sets"]
    seeds: ["chisel", "hand tool", "wrench", "socket set", "ratchet set",
            "pliers", "hammer", "screwdriver", "utility knife", "clamp",
            "vise", "level ", "tape measure", "hand saw", "hacksaw",
            "allen key", "hex key", "torque", "bolt", "nut and bolt", "screw",
            "fastener", "washer set", "wall anchor", "cable tie", "zip tie",
            "hardware kit", "tool set", "irwin", "knipex", "channellock",
            "estwing", "stanley tool", "bessey", "wera ", "mechanics tool",
            "bar clamp", "stud finder", "bolt cutter"]
    exclude: ["power tool", "cordless drill", "impact driver", "speed handle",
              "gift for men", "kids tool", "toy tool", "drill toy",
              "arm & hammer", "arm and hammer", "hammermill", "clamp-on",
              "clamp on", "clamp lid"]
    seed_exempt: ["Stanley", "Bahco", "DeWalt mechanics sets"]  # Stanley is also a
    # drinkware brand here; "mechanics tool" above covers the DeWalt sets

  - name: "Tie-downs"
    group: "Tools & garage"
    description: >
      Ratchet straps, tie-down straps, bungee cords, cargo straps, and
      securing/hauling straps.
    subtypes: ["ratchet straps", "bungee cords", "cargo straps", "tow straps"]
    seeds: ["ratchet strap", "tie down", "tie-down", "bungee", "cargo strap",
            "tow strap", "cam buckle", "cargo net", "recovery strap",
            "lashing strap"]

  - name: "Garage & tool organization"
    group: "Tools & garage"
    description: >
      Garage, workshop, and tool organization — tool chests and cabinets,
      pegboards and hooks, tool racks and holders, wall-mount systems,
      workshop shelving, and tool storage solutions. (Workshop/tool
      focused; general bins go under "Storage bins & totes", food
