# Recall legend — the names Bat's List tends to miss.
#
# Hand-curated. Each term is a plain search the viewer drops into the search
# box when clicked, nothing more: no matching, no flagging, no effect on any
# filter. The chip shows how many of this week's lots it finds; a name with
# none this week is dimmed but kept, because the point is to remember it.
#
# NAMES ONLY — brands, product lines, distinctive item names. Never a generic
# item type ("tumbler", "cookware", "tortilla chips"): Bat's List owns types
# and already flags them, so a type chip reminds nobody of anything (user
# decision, 2026-09-23). Favour names that recur here and that Bat's List
# leaves unflagged. Groups are only headings.
#
# Search is substring on every token, so a short name can be noisy ("ego"
# finds LEGO, "vans" finds CANVAS). After editing:
#     python3 tools/recall_legend.py check   # weeks seen / now / missed, noise
#     python3 tools/recall_legend.py build   # writes the viewer JSON; commit both
# `suggest` lists brands from data/Watch/history.tsv not covered yet.

groups:
  # Product names with repeated bids or watches in the history — the few
  # cases where the name is the search, not the type of thing.
  - name: "Names we keep bidding on"
