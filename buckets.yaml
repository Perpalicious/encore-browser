    seeds: ["nintendo", "switch console", "playstation", "ps4", "ps5", "xbox",
            "meta quest", "oculus", "steam deck", "vr headset", "game controller",
            "gaming controller", "dualsense", "joy-con", "joycon", "amiibo",
            "video game", "gamecube", "sega"]
    categories: ["Computers & Electronics - Consumer Electronics - Video Games"]

