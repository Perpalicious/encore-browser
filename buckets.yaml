  # ------------------------------------------------------------------
  # Added 2026-08-30 from three months of bid/watch history. See
  # data/Watch/FINDINGS.md — 40% of real bids matched no bucket at all.
  #
  # CONSUMABLE buckets carry a condition line in their description.
  # Measured on 54,463 supply lots: personal-care consumables run
  # ~57% "Excellent" / ~25% "Good" and only ~14% sealed. On a sealed
  # consumable those middle grades mean opened, which is an automatic
  # pass — so the condition bar is what makes these buckets scannable
  # (Skincare & body: 892/week raw, ~90/week once sealed-only).
  # ------------------------------------------------------------------

  - name: "Hair care products"
    group: "Personal care"
    description: >
      Hair care you apply — shampoo, conditioner, masks, oils and serums,
      dry shampoo, styling product, and hair colour. Branded or generic.
      Hair DRYERS and stylers go under "Hair styling tools".
      CONSUMABLE: prefer "Brand New - Sealed". "Brand New - Open Box",
      "Excellent" or "Good" on a bottle almost always means opened or
      part-used, which is an automatic pass.
    # sealed consumable — see header. All three are HiBid "new" gradings;
    # "Brand New - Open Box" is deliberately absent, that's an opened pack.
    condition_in: ["Brand New - Sealed", "New (Adjusted Quantity)", "Best Before (Grocery)"]
    examples: ["Pantene", "Head & Shoulders", "Olaplex", "Garnier", "Dove"]
    subtypes: ["shampoo", "conditioner", "hair masks & oils", "styling product",
               "dry shampoo", "hair colour"]
    seeds: ["shampoo", "conditioner", "hair mask", "hair oil", "hair serum",
            "dry shampoo", "hair spray", "hairspray", "hair gel", "hair mousse",
            "leave in", "hair color", "hair colour", "hair dye", "everpure",
            "pantene", "head & shoulders", "olaplex", "garnier", "dove ",
            "tresemme", "aussie ", "herbal essences", "moroccanoil"]
    exclude: ["dog shampoo", "pet shampoo", "car shampoo", "wash shampoo"]

  - name: "Hair styling tools"
    group: "Personal care"
    description: >
      Powered hair tools — dryers, straighteners and flat irons, curling
      irons and wands, multi-stylers, diffusers, and hot brushes. These are
      APPLIANCES, not consumables, so ordinary used condition is fine and
      the usual quality bar applies instead. A high-value styler in Fair
      condition can still be worth flagging.
    examples: ["Dyson Airwrap", "Shark FlexStyle", "ghd", "Revlon One-Step", "T3"]
    subtypes: ["hair dryers", "straighteners", "curling irons", "multi-stylers",
               "hot brushes"]
    seeds: ["hair dryer", "hairdryer", "blow dryer", "hair straighten",
            "flat iron", "curling iron", "curling wand", "hot brush",
            "airwrap", "flexstyle", "supersonic", "one step volumizer",
            "hair clipper", "ghd ", "revlon one"]
    seed_exempt: ["T3"]  # "T3" collides with model numbers across the catalogue

  - name: "Skincare & body"
    group: "Personal care"
    description: >
      Skin and body products — lotions and moisturisers, body wash, face
      wash and cleansers, serums and toners, sunscreen, body butter and
      scrubs, hand cream. Branded or generic; this is a SCAN bucket.
      CONSUMABLE: prefer "Brand New - Sealed". Roughly 57% of this category
      grades "Excellent" and 25% "Good", and on a pump bottle or tube that
