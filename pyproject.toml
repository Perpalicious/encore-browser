[project]
name = "encore-lot-browser"
version = "0.1.0"
description = "Encore Auctions lot browser — scraper, build script, and viewer"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["build/tests", "scraper/tests"]
addopts = "-v"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"
