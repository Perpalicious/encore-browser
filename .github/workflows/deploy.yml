name: Deploy viewer to GitHub Pages

# Deploys are done locally with `npx gh-pages -d dist -b gh-pages`, not here.
# The push trigger is intentionally removed: this repo is capped on Actions
# storage, so a push to main must not kick off a Pages build. Left as
# workflow_dispatch-only so it can still be run by hand if that ever changes.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Cancel any in-flight deploy when a newer one starts.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build viewer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: viewer/package-lock.json

      - name: Verify bundle is present
        run: |
          if [ ! -f viewer/src/data/auction_bundle.json ]; then
            echo "::error::viewer/src/data/auction_bundle.json is missing. Run 'python -m build --raw ... --categorized ... --output viewer/src/data/auction_bundle.json' locally, commit the result, and push again." >&2
            exit 1
          fi
          echo "Bundle present ($(wc -c < viewer/src/data/auction_bundle.json) bytes)."

      - name: Install dependencies
        working-directory: viewer
        run: npm ci

      - name: Build
        working-directory: viewer
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: viewer/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
