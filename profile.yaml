# Bat's taste profile — the "why" behind buckets.yaml.
#
# This file and buckets.yaml are BOTH attached to the flagging chat. The
# profile explains what this household actually wants; buckets.yaml is the
# navigable taxonomy that interest is expressed through.
#
# WRITTEN IMPERSONALLY ON PURPOSE. This repo is public. Interests, brands,
# age bands and sizes are fine here; names, relations and addresses are not,
# and they buy nothing in recall. Say "kids' toys, ages 8-11" rather than
# naming a person.
#
# Three fields do mechanical work and are linted by tools/prefilter.py:
#
#   buckets:  the buckets in buckets.yaml this interest justifies. Every
#             bucket must be claimed by at least one interest — an unclaimed
#             bucket is a question to answer, not a silent orphan. An interest
#             with `buckets: []` is a pure PSEUDO-BUCKET: it has no place in
#             the taxonomy but its seeds still shortlist lots, so a genuine
#             personal pick outside every bucket can still reach the model.
#   tags:     the controlled vocabulary for `personal_tags`. Anything outside
#             this set is reported by tools/verify_passes.py.
#   seeds:    lexical shortlist terms, same matching rules as buckets.yaml.
#             Add them wherever an interest has edges its buckets don't cover
#             — NOT only on pseudo-buckets. "Kids' toys" owns Barbies and Lego
#             but no bucket holds a generic doll; "Garage & workshop" owns
#             Power tools but no bucket holds a hand chisel. Measured, seeding
#             those edges took personal-pick reach from 72.7% to 94.0%.

# These gate apparel and footwear matches — the flagging pass is told to
# reject the right item in the wrong size. Two adults, so each is a map.
sizes:
  apparel:
    womens: "M"
    mens: "L"
  # Deliberately unset (2026-09-15): shoe sizes are mislabelled in these
  # listings often enough that gating on them rejects the right pairs. The
  # Footwear interest is brand-gated instead and flags every size.
  shoe: null

projects:
  - "Home gym build-out — rack, bar, plates, flooring, accessories."
  - "Kids' playroom and active-play build-out — climbing holds, ninja
     course gear, swings, mats, trampolines (see \"Playroom & active play\")."
  - "Garage/workshop organisation and tooling."
  - "3D printing: filament, spare parts, consumables."
  - "Yard and lawn upkeep on an ongoing basis."
  - "Pool and hot tub maintenance across the season."
  - "Small-business product testing — items bought to evaluate and resell."

# SCOPE LOCK (2026-09-15, user decision). Bat's List is a TARGETED list —
# short enough to actually read — not a scan of the auction; the main viewer
# does the wide search. On 2026-09-13 the list held 40% of the auction while
# the household engaged with ~1 in 80 flagged lots, so every broad bucket was
# narrowed to what the bid/watch history shows is actually wanted, and the
# zero-engagement catch-alls were retired (see the header of buckets.yaml for
# the list). DO NOT widen any bucket, soften any brand gate, or re-add a
# retired bucket without the user's EXPLICIT permission in the conversation
# where the edit is made. The exception is the short list of SCAN buckets
# named in buckets.yaml — those stay broad on purpose. If a wanted item is
# being missed, add the specific product or brand to the matching bucket;
# never the whole type.
#
# HOW THINGS ACTUALLY GET REJECTED. Even inside the narrowed buckets, plenty
# gets browsed and still not bought — that is condition and price, not
# disinterest. Fix a miss by adding a product; do not fix a low bid rate by
# widening a bucket.
#   - On CONSUMABLES (personal care, food, cleaning) anything below
#     "Brand New - Sealed" usually means opened. Measured across 54,463
#     lots, personal-care categories run ~57% "Excellent" and only ~14%
#     sealed. Note "Brand New - Open Box" is an OPENED pack despite the
#     name — it is unused merchandise, not an intact seal.
#   - Even "Brand New - Sealed" does not guarantee sealed. One such lot
#     reads "2 sealed, 1 opened amount of sheets unknown".
#   - If the photos cannot show an intact seal on something meant to be
#     sealed, that is a pass regardless of the stated grade.
#   - EXCEPTION since 2026-09-23, the OUTER-BOX RULE: in Cosmetics & nail
#     and Snacks & confectionery, "Brand New - Open Box" and "Excellent"
#     usually mean an opened outer box around sealed units (a 42-bag
#     carton, a box of nail tips), and graders apply them inconsistently.
#     Skincare & body takes Open Box only (a twin-pack sleeve); "Excellent"
#     there is too common to admit. Those are flagged and Bat judges the
#     seal from the photos. "Good" and below is still a pass, and every other
#     consumable keeps the sealed-only bar — widening it everywhere would
#     flood the list.
# Buckets whose descriptions say CONSUMABLE encode this bar.

not_wanted:
  - "Consumables — personal care, food, drink, cleaning — in any condition
     below New, or where the photos cannot establish that the seal is
     intact. An opened lotion or a broken-seal food pack is an immediate
     pass even when the listing says New. Exception: buckets whose
     description states the OUTER-BOX RULE also accept \"Brand New - Open
     Box\", and some also \"Excellent\" — accept exactly the grades that
     bucket's description names."
  - "Broken, incomplete, or non-functional items, unless the profile
     explicitly wants that type for parts or repair."
  - "Generic no-brand single utensils, cables, and accessories with no
     resale or practical value."
  - "Apparel and footwear outside the sizes above."
  - "Consumables already stocked in quantity."

interests:
  - name: "Home gym"
    buckets: ["Weights, bars & racks", "Gym accessories"]
    tags: ["home_gym"]
    description: >
      Strength training equipment for a home gym — barbells, plates, racks,
      benches, dumbbells, kettlebells, cable machines, and gym flooring.
      The single largest standing interest. Split on 2026-09-15 so the
      hardware is not buried under yoga mats: "Weights, bars & racks" is
      the equipment, "Gym accessories" the bands, mats, attachments and
      small gear. CAP bumper plates and adjustable dumbbells get watched
      repeatedly.
    # Fitness gear the bucket's own seeds don't reach.
    seeds: ["fitness", "workout", "exercise", "training bag", "bag stand",
            "gym ", "weight lifting", "weightlifting", "strength training"]

  - name: "Sports & outdoor recreation"
    buckets: ["Backyard games", "Nets, goals & hoops", "Bikes, scooters & skates",
              "Outdoor furniture & hammocks"]
    tags: ["family_outdoors", "family_activity"]
    description: >
      Family outdoor activity and yard seating — backyard games (cornhole,
      ladder toss, Spikeball), soccer nets, goals and hoops for practice,
      bikes, scooters and skates with their pads and helmets, hammocks and
      patio furniture. The old "Sports & recreation gear" bucket (808 lots
      a week) was retired on 2026-09-15: balls, sticks, racquets, tents
      and camping gear are NOT wanted — none drew a bid in four months.

  - name: "Kids' toys & games"
    buckets: ["Barbies", "Lego", "Surprise toys", "Hatchimals", "Board games",
              "Dolls, plush & playsets", "Outdoor play, swim & blasters",
              "Kids' craft & activity", "Playroom & active play"]
    tags: ["kids_interest", "family_activity", "playroom"]
    description: >
      Toys and games for a girl roughly ages 8-11, plus board games the
      whole household plays (a SCAN bucket — rarely bought, kept on
      purpose). Collectible and blind-box toys included. Nerf and water
      blasters are a repeat buy. Action figures and figurines are not
      wanted. The playroom build-out (climbing holds, ninja course kits,
      swings, mats) is a live project — see "Playroom & active play".
    # "Dolls & plush" now covers dolls/plush/figures. These seeds catch the
    # remaining edges — craft and activity toys with no bucket of their own.
    seeds: ["toy ", "toys", "craft kit", "art set", "kids ", "children",
            "toddler", "frozen ", "ride on", "colouring", "coloring book",
            "sticker", "science kit", "building set"]

  - name: "Playroom & active play"
    buckets: ["Playroom & active play"]
    tags: ["playroom", "kids_interest"]
    description: >
      A playroom / active-play build-out for a kid — rock climbing holds
      and wall kits, ninja-warrior obstacle and slackline kits, monkey
      bars, swings and swing hangers, trampolines, gymnastics and crash
      mats, balance beams, Pikler triangles, play couches. A live project,
      so a complete, well-made set is a personal match even from a lesser
      brand; a single flimsy accessory is not.
    seeds: ["climbing hold", "ninja line", "ninja warrior", "obstacle course",
            "monkey bar", "swing set", "gymnastics mat", "crash mat",
            "balance beam", "pikler", "play couch"]

  - name: "PC & desk setup"
    buckets: ["Keyboards, keycaps & switches", "PC peripherals",
              "Monitors & displays", "Networking", "VR headsets & accessories",
              "Audio & headphones"]
    tags: ["pc_accessory", "pc_gaming", "secondary_monitor", "networking",
           "mechanical_keyboard", "vr"]
    description: >
      Desktop PC and gaming setup — keyboards, mice, monitors, headsets,
      capture and streaming gear, networking equipment, and VR. Mechanical
      keyboards, keycaps and switches are THE specific enthusiasm here (11
      keyboard bids and a keycap-set bid in four months; Logitech G915 /
      G515 / Alto Keys, Keychron, GMMK, Razer, SteelSeries Apex, Ajazz,
      Yunzii all engaged) — an enthusiast board in decent condition is a
      personal match, not just a bucket entry. Consoles and console games
      are NOT wanted; VR gear is. Drones, tablets, cameras and wearables
      are NOT wanted (the "Electronics" catch-all was retired 2026-09-15).

  - name: "Smart home"
    buckets: ["Smart home", "Smart locks"]
    tags: ["smart_home"]
    description: >
      Home automation — smart bulbs and strips, plugs, thermostats, sensors,
      video doorbells, and keyless entry hardware.

  - name: "Garage & workshop"
    buckets:
      ["Power tools", "Hand tools", "Garage & tool organization",
       "Adhesives & tape", "Extension cords & power strips", "Tie-downs"]
    tags: ["garage_workshop", "tooling", "garage_organization",
           "charging_and_power", "yard_and_garage"]
    description: >
      An actively used workshop — power and hand tools (heat guns, sanders,
      nailers, clamps and a soldering station have all been bid on or
      watched), tool storage and organisation, fasteners and adhesives,
      cords, and tie-downs for hauling. Household batteries, power banks
      and chargers are NOT wanted ("Batteries & chargers" retired
      2026-09-15, zero engagement in four months); a power-tool battery for
      a platform already owned still counts under "Power tools".
    # "Hand tools" now covers the tools and fasteners themselves. These are
    # the workshop consumables and PPE that still have no bucket.
    seeds: ["work glove", "safety glass", "safety goggle", "ear protection",
            "dust mask", "respirator", "shop towel", "wd-40", "lubricant",
            "sandpaper", "abrasive", "drop sheet"]

  - name: "3D printing"
    buckets: ["3D printing supplies"]
    tags: ["3d_printing", "3d_printing_consumable"]
    description: >
      An operating 3D printer — filament and resin, nozzles, build plates,
      and printer spares. Filament is a recurring consumable.

  - name: "Yard & lawn"
    buckets:
      ["Lawn equipment", "Garden hose", "Gardening tools",
       "Garden & lawncare misc", "Lawn treatment & pest control"]
    tags: ["outdoor_maintenance", "yard_watering"]
    description: >
      Ongoing yard upkeep — mowers and trimmers, hoses and watering, hand
      garden tools, lawn treatments, and tarps.
    seeds: ["mosquito", "bug zapper", "pest control", "wasp", "gazebo",
            "screen tent", "outdoor umbrella", "wheelbarrow", "garden cart"]

  - name: "BBQ & outdoor cooking"
    buckets: ["BBQ accessories"]
    tags: ["outdoor_cooking", "bbq_accessory"]
    description: >
      Grilling and outdoor cooking — grill tools and accessories, smoking
      supplies, thermometers, covers, and fuel.

  - name: "Kitchen"
    buckets:
      ["Mixers, blenders & food prep", "Espresso & specialty appliances",
       "Brand cookware", "Brand chef knives", "Kitchen utensils & gadgets",
       "Glassware & drinkware", "Dinnerware", "Kitchen storage & organization",
       "Insulated drinkware"]
    tags: ["premium_kitchen", "insulated_drinkware"]
    description: >
      A well-equipped kitchen that rewards quality — recognisable-brand
      mixers, blenders and food prep (KitchenAid, Vitamix, Braun, Breville
      — every kitchen-appliance bid in four months was one of these),
      espresso/Nespresso machines and the odd specialty machine (Creami,
      sous vide), and GOOD cookware (All-Clad, Made In, Tramontina tri-ply,
      Le Creuset, Lodge — never a random single-ply stainless pan). Toasters,
      kettles, air fryers and drip coffee makers are NOT wanted; the broad
      "Kitchen appliances" bucket was split and narrowed on 2026-09-15.
      Utensils & gadgets is a small SCAN bucket kept on purpose. Quality
      is the whole point here: generic no-brand pieces are explicitly not
      wanted, and the buckets encode that gate in their own descriptions.
      Insulated drinkware is an active, repeat interest on its own — a
      S'well travel mug, an Ember heated mug and a Hydro Flask mug have all
      drawn bids, and Stanley Quenchers and Thermos kids' bottles get
      watched. Treat Stanley / Owala / Hydro Flask / S'well / Yeti
      tumblers, bottles and travel mugs as a personal match, not just a
      bucket entry. Food and drink itself now lives in its own interest below.

  - name: "Cleaning"
    buckets: ["Cleaning supplies & tools", "Handheld & cordless vacs",
              "Robot vacuums & mops", "Vacuums & floor care"]
    tags: ["cleaning_consumable", "cleaning_equipment", "second_shop_vac",
           "proven_resale"]
    description: >
      Household cleaning — handheld and cordless vacs are the most-bid
      thing in the whole history (Shark WandVac is proven resale; Bissell
      PowerClean, Dustbuster and Shark Cyclone all bid), robot vacuums are
      watched as a separate purchase, a second shop vac is actively wanted,
      and the supplies side is sponges and dish wands (always looked for),
      spin scrubbers, brand mops and brand cleaning solutions. Paper goods
      and generic cleaning kits are NOT wanted.

  - name: "Storage & organization"
    buckets: ["Storage bins & totes", "Laundry baskets"]
    tags: ["home_organization"]
    description: >
      General household storage — plastic bins and lidded totes, stackable
      containers, organising bins, and laundry baskets.

  - name: "Bed & bath"
    buckets:
      ["Bedding & pillows", "Bed linens", "Bath towels", "King bed frames",
       "Nightstands", "Seating & occasional furniture"]
    tags: ["bed_and_bath_linens"]
    description: >
      Bedroom and bathroom textiles and furniture, plus living-space seating
      and occasional tables. Bed size is king — check size before flagging
      fitted sheets or frames. "Bedding & pillows" was shrunk to BRAND
      throws, premium pillows/toppers and weighted blankets on 2026-09-15
      (693 lots a week, zero bids); mattresses and generic pillows are NOT
      wanted.

  - name: "Footwear"
    buckets: ["Brand shoes (adult)", "Brand shoes (kids)"]
    tags: ["footwear", "kids_footwear"]
    description: >
      BIG-brand footwear only — Hunter, UGG, Nike, Adidas, Crocs, Sorel,
      Blundstone, Dr. Martens, Birkenstock, New Balance and the like — for
      the adults and for a kid. Off-brand shoes are not wanted at all. NOT
      size-gated: listings mislabel shoe sizes often enough that a size
      gate was rejecting the right pairs, so flag any branded pair and note
      the listed size in the reasoning. Split adult/kids 2026-09-15.

  - name: "Personal care & grooming"
    buckets: ["Hair care products", "Hair styling tools", "Skincare & body",
              "Oral & dental care", "Shaving & grooming", "Cosmetics & nail"]
    tags: ["personal_care", "hair_care", "skincare", "nail_care", "dental_care"]
    description: >
      Everyday personal care for two adults — hair care and styling, skin and
      body products, oral and dental, shaving and grooming, and makeup/nail.
      This is one of the largest categories in the auction (~840 lots a week)
      and had NO bucket before 2026-08-30 despite eight bids in three months.
      Almost all of it is consumable, so the condition bar in `not_wanted`
      does the real filtering: the interest is broad, the acceptance is
      narrow. Powered tools in these buckets (hair stylers, electric
      shavers, toothbrushes, water flossers) are appliances judged on value,
      not on seal — and since 2026-09-15 they are BRAND-gated: Shark
      FlexStyle and Dyson Airwrap (both bid), Philips OneBlade (bid twice),
      Sonicare / Oral-B / Waterpik. A no-name styler or "sonic toothbrush"
      is not wanted.
      Nail is a distinct and consistent sub-interest — gel systems, press-on
      tips and manicure kits, not just polish.
    seeds: ["grooming", "personal care", "toiletries", "cosmetic",
            "salon", "spa set", "gift set bath"]

  - name: "Food & drink"
    buckets: ["Coffee & espresso", "Pantry & cooking staples",
              "Snacks & confectionery", "Beverages & drink mixes",
              "Supplements & protein"]
    tags: ["food_and_drink", "coffee", "snacks", "supplements"]
    description: >
      Groceries worth buying at auction. These are SCAN buckets — they get
      browsed every week even though they convert rarely, so keep them broad
      and do not narrow them on a low flag rate.
      Coffee is a standing consumable: beans are ground at home for iced
      coffee, so whole bean and ground both count, pre-ground included.
      Snacks and branded drinks earned their buckets from the history —
      protein cookies, Crystal Light and a Taco Bell kit were all bid on
      while no bucket existed to hold them. Supplements pair with the home
      gym interest.
      Everything here is consumable: prefer New, and treat an unprovable
      seal as a pass — except Snacks & confectionery, which follows the
      OUTER-BOX RULE in its bucket description.
    seeds: ["grocery", "food lot", "snack", "beverage", "drink ", "pantry"]

  - name: "Product testing & resale"
    buckets: []
    tags: ["product_testing", "small_business", "proven_resale"]
    description: >
      Items bought to evaluate, review, or resell through a small business.
      Cuts across every category, so it is a lens rather than a bucket: a lot
      can be a product-testing pick without belonging to any bucket.
      PROVEN RESALE is the strong form of this and is listed separately below.
      A product already resold successfully is worth flagging on every
      reappearance, at any quantity, even in mediocre condition — the resale
      value is known rather than estimated. Tag those `proven_resale`.
      Do NOT infer resale intent from a product simply appearing in many lots.
      These auctions over-list heavily: one week ran 46 identical Shark
      FlexStyle lots and only 2 were bid on. Lot count measures supply, not
      appetite.
    seeds: ["wholesale lot", "case pack", "bulk lot", "pallet", "retail box"]


  - name: "Pool & hot tub"
    buckets: ["Pool & hot tub care"]
    tags: ["pool_maintenance", "pool_recreation", "hot_tub_maintenance"]
    description: >
      Seasonal pool and hot tub upkeep — chemicals, test strips, filters,
      pumps, skimmers, robotic cleaners, covers and hot tub supplies. Got
      its own refined bucket on 2026-09-15; it is deliberately kept free
      of floats, noodles and pool toys (those are kids' outdoor play).

  - name: "Practical lighting"
    buckets: []
    tags: ["practical_lighting"]
    description: >
      Work and utility lighting rather than decorative — shop lights, work
      lights, headlamps, flashlights, motion floodlights, and solar path
      lighting. Smart/colour-changing lighting belongs to Smart home instead.
    seeds:
      ["work light", "shop light", "led shop", "flashlight", "headlamp",
       "floodlight", "flood light", "lantern", "solar light", "light bar",
       "utility light", "spotlight", "spot light", "led bulb", "light bulb",
       "string light", "path light", "garden light", "solar lamp",
       "motion light", "camping light"]

  - name: "Vehicle"
    buckets: ["Car care & detailing"]
    tags: ["tesla_model_3", "car_care"]
    description: >
      Two distinct things. First, model-fit parts for a Tesla Model 3 — floor
      mats, chargers, screen protectors, interior parts — where the fit has to
      be plausible. Second, car cleaning and detailing generally, which is NOT
      Tesla-specific: branded wash, wax, wheel and interior products get bought
      repeatedly regardless of vehicle.
      Corrected 2026-08-30. This interest previously said "generic car
      accessories are not wanted", which contradicted the history — Chemical
      Guys and Meguiar's products were bid on three times in three months while
      Tesla-fit parts appeared once.
    seeds: ["tesla", "model 3", "ev charger", "nema 14-50", "j1772"]

# Products already resold at a profit, so the margin is known rather than
# guessed. Flag every reappearance. Keep this list short and user-maintained
# — it is high precision by construction and worthless if it drifts into a
# wishlist. Add a line only after an actual completed resale.
proven_resale:
  - product: "Shark WandVac handheld vacuum"
    seeds: ["wandvac", "wand vac"]
    note: >
      Resold once already. 21 bids across the history, 16 in the 2026-07-19
      auction alone — the one same-product run in the data that reflects
      genuine intent rather than the auction over-listing.
