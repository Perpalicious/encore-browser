<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Encore Lot Browser</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          sans: ['Geist', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          serif: ['Newsreader', 'ui-serif', 'Georgia', 'serif'],
          mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'monospace'],
        },
        colors: {
          // Warm editorial palette
          paper:  '#FAF6EE',    // background, light
          paper2: '#F3ECDD',    // chip / surface
          ink:    '#1A1612',    // primary text light
          ink2:   '#544A3D',    // secondary text light
          rule:   '#E6DDC8',    // hairline light
          ember:  '#B6502A',    // accent (terracotta ember)
          ember2: '#8B3A1A',    // accent dark
          // Dark mode — charcoal (neutral, no brown cast)
          night:  '#0F1012',    // background, dark
          night2: '#17181B',    // surface, dark
          coal:   '#1F2024',    // surface-2, dark
          bone:   '#ECEDEF',    // primary text dark
          bone2:  '#A0A2A8',    // secondary text dark
          dusk:   '#2A2C31',    // hairline dark
        },
        boxShadow: {
          card: '0 1px 0 rgba(26,22,18,0.04), 0 1px 2px rgba(26,22,18,0.04), 0 4px 12px -2px rgba(26,22,18,0.06)',
          cardHover: '0 1px 0 rgba(26,22,18,0.05), 0 8px 24px -6px rgba(26,22,18,0.14)',
          cardDark: '0 1px 0 rgba(0,0,0,0.4), 0 4px 12px -2px rgba(0,0,0,0.4)',
          pop: '0 12px 40px -10px rgba(26,22,18,0.25)',
        },
        keyframes: {
          shimmer: {
            '0%':   { backgroundPosition: '-200% 0' },
            '100%': { backgroundPosition: '200% 0' },
          },
          slideDown: {
            '0%':   { opacity: '0', transform: 'translateY(-4px)' },
            '100%': { opacity: '1', transform: 'translateY(0)' },
          },
          fadeIn: {
            '0%':   { opacity: '0' },
            '100%': { opacity: '1' },
          },
        },
        animation: {
          shimmer: 'shimmer 1.6s linear infinite',
          slideDown: 'slideDown 220ms cubic-bezier(.2,.7,.2,1)',
          fadeIn: 'fadeIn 280ms ease-out',
        },
      },
    },
  };
</script>

<style>
  html, body { background: #FAF6EE; }
  html.dark, html.dark body { background: #0F1012; }
  body {
    font-family: 'Geist', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    font-feature-settings: 'ss01', 'cv11';
  }
  .font-serif { font-feature-settings: 'liga', 'kern'; letter-spacing: -0.01em; }

  /* Custom scrollbar for the filter chip rows */
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  /* Skeleton shimmer */
  .shimmer {
    background-image: linear-gradient(90deg, transparent 0%, rgba(26,22,18,0.06) 50%, transparent 100%);
    background-size: 200% 100%;
    background-repeat: no-repeat;
  }
  .dark .shimmer {
    background-image: linear-gradient(90deg, transparent 0%, rgba(239,230,210,0.06) 50%, transparent 100%);
  }

  /* Expand animation: grid-template-rows trick */
  .expand-grid { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 320ms cubic-bezier(.2,.7,.2,1); }
  .expand-grid.open { grid-template-rows: 1fr; }
  .expand-grid > .expand-inner { overflow: hidden; }

  /* Focus rings — warm, not blue */
  *:focus-visible { outline: 2px solid #B6502A; outline-offset: 2px; border-radius: 4px; }
  html.dark *:focus-visible { outline-color: #D87B57; }

  /* Stop iOS auto-zoom on input focus */
  input, select, textarea { font-size: 16px; }

  /* Reduce motion */
  @media (prefers-reduced-motion: reduce) {
    .expand-grid, .expand-grid * { transition: none !important; animation: none !important; }
  }
</style>
</head>

<body class="font-sans text-ink dark:text-bone">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="mock-data.jsx"></script>
  <script type="text/babel" src="card.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
