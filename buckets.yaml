# Bat's List — curated item types to flag at auction.
# The Agent matches SEMANTICALLY against these descriptions.
# `examples` are illustrative hints, NOT an exhaustive whitelist —
# generic/off-brand items still match if they fit the description.
#
# `group` assigns each bucket to a top-level group for two-level
# Bat's List navigation in the viewer. The Agent IGNORES `group`
# (it only matters to the build script / viewer).
#
# Four fields drive tools/prefilter.py and are NOT shown to the Agent:
#
#   seeds:      lexical shortlist terms. Lowercased, anchored at a word
#               boundary on the LEFT only — `tote` matches "TOTES" and `key`
#               matches "KEYBOARD" but not "MONKEY". Include both type words
#               and brand names, since many titles are a bare brand.
#   categories: HiBid breadcrumb PREFIXES, matched on whole " - " segments.
#               This is the only axis that reaches a bare-SKU lot whose title
#               carries no usable keyword at all.
#   exclude:    veto terms. A lot matching one is never shortlisted for this
#               bucket, at zero model cost.
#   aliases:    former names of this bucket, so --backtest can score a
#               previous week's labels after a rename.
#
# THE PREFILTER MUST NEVER ENCODE A QUALITY GATE. Several buckets below say
# "QUALITY or BRANDED ... do NOT flag generic". That judgement belongs to the
# Agent, reading `description`. Seed those buckets with plain TYPE words so
# the shortlist stays wide; encoding the gate as a keyword rule would turn
# curation into string matching and destroy it.
#
# `subtypes` IS shown to the Agent — it is the advisory vocabulary for
# `bats_subtype`, the drill-down's third level. Reusing wording is the whole
# point; forty near-synonyms are useless as navigation.

buckets:
  - name: "Smart home"
    group: "Electronics & gaming"
    description: >
      Smart lighting and home-automation devices — smart bulbs, LED light
      strips, smart switches and plugs, smart thermostats, smart hubs,
      sensors, video doorbells, and anything app- or voice-controlled for
      the home. Branded or off-brand both qualify.
    examples: ["Hue", "Lifx", "Govee", "Lepro", "Ecobee", "Nest", "Wyze", "Kasa", "Sengled"]
    subtypes: ["smart bulbs", "light strips", "smart plugs", "thermostats",
               "sensors", "video doorbells", "smart hubs"]
    seeds: ["smart bulb", "smart light", "light strip", "led strip", "smart plug",
            "smart switch", "smart outlet", "thermostat", "smart hub", "video doorbell",
            "doorbell camera", "motion sensor", "smart sensor", "alexa", "google home",
            "smart speaker", "hue", "lifx", "govee", "lepro", "ecobee", "wyze",
            "kasa", "sengled", "smart home", "ring sensor", "ring alarm",
            "ring camera", "blink camera", "arlo", "security camera",
            "smart doorbell", "echo dot", "echo show", "smart display"]
    seed_exempt: ["Nest"]  # nesting bowls, nesting tables

  - name: "Smart locks"
    group: "Electronics & gaming"
    description: >
      Smart and keyless locks of every kind — not just doors. Smart door
      locks and deadbolts, keypad/keyless entry locks, fingerprint and app-
      or Bluetooth-controlled locks, smart gate locks, smart padlocks, and
      outdoor/garage smart locks. Any keyless-entry hardware counts.
      Branded or generic.
    examples: ["August", "Schlage Encode", "Yale Assure", "Level", "Wyze Lock", "Master Lock smart", "eufy"]
    subtypes: ["door locks", "deadbolts", "keypad locks", "padlocks", "lock boxes"]
    seeds: ["smart lock", "keyless lock", "keyless entry", "keypad lock",
            "fingerprint lock", "deadbolt", "smart deadbolt", "smart padlock",
            "schlage", "yale assure", "august lock", "eufy lock", "lockbox",
            "lock box"]
    seed_exempt: ["August", "Level", "Wyze Lock", "Master Lock smart", "eufy"]

  - name: "Electronics"
    group: "Electronics & gaming"
    description: >
      Notable consumer electronics and gadgets with resale value — audio
      gear, headphones/earbuds, computer accessories, tablets, streaming
      devices, cameras, and similar. Favor recognizable or higher-value
      items over generic cables and no-name accessories.
      (Video games, consoles, and VR go under "Video games & VR".)
    examples: ["Sony", "Bose", "Anker", "Logitech", "JBL", "Apple"]
    subtypes: ["headphones", "earbuds", "speakers", "soundbars", "tablets",
               "cameras", "streaming devices", "monitors", "webcams",
               "microphones", "projectors", "smartwatches", "drones"]
    seeds: ["headphone", "earbud", "earphone", "headset", "soundbar", "bluetooth speaker",
            "portable speaker", "tablet", "ipad", "kindle", "e-reader", "streaming stick",
            "roku", "chromecast", "fire tv", "apple tv", "webcam", "microphone",
            "projector", "smartwatch", "smart watch", "fitbit", "drone", "turntable",
            "receiver", "amplifier", "monitor", "docking station", "usb hub",
            "power bank", "sony", "bose", "anker", "logitech", "jbl", "beats",
            "sennheiser", "samsung", "nikon", "canon", "gopro", "airpod",
            "apple watch", "ipod", "macbook", "laptop", "wifi adapter",
            "usb adapter", "bluetooth adapter", "ethernet adapter", "wifi extender",
            "router", "modem", "tp link", "garmin", "dji ", "usb c to",
            "phone case", "screen protector", "smart ring", "magic mouse",
            "magic keyboard", "airtag", "magsafe", "tile tracker", "mouse",
            "usb receiver", "sd card", "memory card", "external drive", "ssd "]
    # Deliberately NOT the whole "Computers & Electronics" tree: that is 1,245
    # lots and made this bucket the same absorber it already was. These are the
    # leaves where the item genuinely is consumer electronics.
    categories:
      - "Computers & Electronics - Consumer Electronics - Home Audio"
      - "Computers & Electronics - Consumer Electronics - Tablets"
      - "Computers & Electronics - Consumer Electronics - TVs"
      - "Computers & Electronics - Consumer Electronics - Blu-ray / DVD Players"
      - "Computers & Electronics - Cameras & Camera Accessories"
      - "Computers & Electronics - Computers - Monitors"
      - "Computers & Electronics - Computers - Laptops"
      - "Computers & Electronics - Computers - Desktop / All-in-Ones"
      - "Computers & Electronics - Computers - Networking"
      - "Computers & Electronics - Consumer Electronics - Phones"
    exclude: ["blood pressure monitor", "baby monitor", "bp monitor",
              "monitor stand", "monitor mount", "monitor arm"]
    seed_exempt: ["Apple"]  # matches apple juice, apple cider, applesauce

  - name: "Keyboards & PC peripherals"
    group: "Electronics & gaming"
    aliases: ["Mechanical keyboards"]
    description: >
      Keyboards of every kind — mechanical, membrane, wireless, gaming,
      compact/TKL/60% — plus keycaps, key switches and keyboard accessories,
      AND PC input peripherals generally: mice, mousepads, trackballs, wrist
      rests, and keyboard/mouse combos. Any switch type qualifies; you
      usually cannot tell mechanical from membrane out of a title, so do not
      try to — flag it and say which in `bats_subtype` when the title makes
      it clear. Branded or generic.
    examples: ["Keychron", "Ducky", "GMMK", "Akko", "Logitech", "Razer",
               "SteelSeries", "Corsair", "HyperX", "Redragon", "MSI"]
    subtypes: ["mechanical keyboards", "membrane keyboards", "keycaps",
               "key switches", "mice", "mousepads", "kb+mouse combos",
               "keyboard accessories", "trackballs"]
    seeds: ["keyboard", "keycap", "key switch", "keyswitch", "tkl", "tenkeyless",
            "mechanical key", "hot swap", "hot-swap", "mouse pad", "mousepad",
            "gaming mouse", "wireless mouse", "trackball", "wrist rest",
            "keychron", "ducky", "gmmk", "akko", "razer", "steelseries",
            "corsair", "hyperx", "redragon", "logitech g", "msi forge",
            "usb receiver", "unifying receiver", "keyboard case", "combo touch",
            "keyboard folio", "num pad", "numpad", "macro pad"]
    seed_exempt: ["Logitech", "MSI"]  # both sell far more non-keyboards than
    # keyboards; the type words above already catch their boards.
    categories: ["Computers & Electronics - Computers - Peripherals - Keyboards / Mice"]
    # The mower's "IGNITION KEY SWITCH" was flagged as a mechanical keyboard
    # in the 2026-08-15 run. Killing it here costs zero model tokens.
    exclude: ["ignition key switch", "ignition switch", "piano", "midi",
              "keyboard tray", "keyboard stand"]

