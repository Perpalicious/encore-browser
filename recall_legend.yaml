# Recall legend — the search terms we tend to forget to run.
#
# Hand-curated. Each term is a plain search phrase the viewer drops into the
# search box when clicked, nothing more: no matching, no flagging, no effect
# on any filter. Keep terms short and generic ("clamps", not a brand + model).
# Groups follow buckets.yaml's group names loosely; they are only headings.
#
# Seeded 2026-09-15 from data/Watch/history.tsv (bids + watch list,
# 2026-05-31 → 2026-09-13) via `python3 tools/recall_legend.py suggest`.
# After editing:  python3 tools/recall_legend.py build   (writes the viewer JSON;
# commit both). Re-run `suggest` after appending new history to see what is
# not covered yet.

groups:
  # Product names with repeated bids or watches in the history — the few
  # cases where the name is the search, not the type of thing.
