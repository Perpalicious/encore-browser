[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "encore-lot-browser"
version = "0.1.0"
description = "Encore Auctions lot browser — scraper, build script, and viewer"
requires-python = ">=3.11"
dependencies = [
    "curl-cffi>=0.7",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["scraper/tests", "build/tests", "tools/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"

[tool.setuptools.packages.find]
where = ["."]
include = ["scraper*", "build*", "diff_categorized*", "merge_categorized*"]
